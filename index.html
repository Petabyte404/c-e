<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<title>C + E</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fdf1f5; --bg2:#f3e6ff; --bg3:#ffe3ec;
  --ink:#3b1d4a; --muted:#8a6a9a;
  --card:rgba(255,255,255,.62); --stroke:rgba(255,255,255,.9);
  --accent1:#ff5c8a; --accent2:#a259ff; --shadow:rgba(162,89,255,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#1a0b2e; --bg2:#2a1050; --bg3:#3a1240;
    --ink:#fbeaff; --muted:#c3a1d6;
    --card:rgba(255,255,255,.07); --stroke:rgba(255,255,255,.14);
    --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg1:#1a0b2e; --bg2:#2a1050; --bg3:#3a1240;
  --ink:#fbeaff; --muted:#c3a1d6;
  --card:rgba(255,255,255,.07); --stroke:rgba(255,255,255,.14);
  --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100%;overflow-y:auto;
  font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:var(--accent1);top:-70px;left:-80px}
.b2{width:300px;height:300px;background:var(--accent2);bottom:-100px;right:-110px;animation-delay:-6s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.heart{position:absolute;bottom:-30px;color:var(--accent1);opacity:0;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) scale(.6);opacity:0}
  15%{opacity:.5}
  100%{transform:translateY(-110vh) scale(1.1);opacity:0}
}
main{position:relative;width:100%;max-width:440px;padding:24px 22px;text-align:center}
h1{
  font-family:'Pacifico','Snell Roundhand',cursive;font-weight:400;
  font-size:clamp(3.2rem,18vw,4.8rem);letter-spacing:.02em;line-height:1.5;padding:0 .15em;
  background:linear-gradient(120deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 20px var(--shadow));
}
.sub{
  margin:14px 0 26px;font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--muted);font-weight:500;
}
.grid{display:grid;grid-template-columns:1fr;gap:10px;justify-items:center}
.card{
  background:var(--card);border:1px solid var(--stroke);
  border-radius:20px;padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px var(--shadow);
  animation:pop .7s cubic-bezier(.2,.9,.3,1.2) backwards;
}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:nth-child(4){animation-delay:.21s}.card:nth-child(5){animation-delay:.28s}.card:nth-child(6){animation-delay:.35s}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}}
.num{
  font-family:'Roboto',system-ui,sans-serif;font-weight:700;
  font-size:2.2rem;line-height:1.1;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;
}
.lbl{font-weight:500;min-width:7.2em;text-align:center;padding-left:.2em;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card.sec .num{background:linear-gradient(120deg,var(--accent1),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.since{margin-top:20px;font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main>
  <h1>C + E</h1>
  <p class="sub">zusammen seit:</p>
  <div class="grid">
    <div class="card"><div class="num" id="y">0</div><div class="lbl" id="ly">Jahre</div></div>
    <div class="card"><div class="num" id="mo">0</div><div class="lbl" id="lmo">Monate</div></div>
    <div class="card"><div class="num" id="d">0</div><div class="lbl" id="ld">Tage</div></div>
    <div class="card"><div class="num" id="h">0</div><div class="lbl" id="lh">Stunden</div></div>
    <div class="card"><div class="num" id="mi">0</div><div class="lbl" id="lmi">Minuten</div></div>
    <div class="card sec"><div class="num" id="s">0</div><div class="lbl" id="ls">Sekunden</div></div>
  </div>
  <p class="since">seit dem 31.07.2026 · 16:31 Uhr</p>
</main>
<script>
(function(){
  var start=new Date(2026,6,31,16,31,0);
  var $=function(i){return document.getElementById(i)};
  function set(id,v,one,many){
    var el=$(id); if(el.textContent!==String(v)) el.textContent=v;
    $('l'+id).textContent=(v===1?one:many);
  }
  function tick(){
    var n=new Date();
    if(n<start)n=start;
    var y=n.getFullYear()-start.getFullYear(),
        mo=n.getMonth()-start.getMonth(),
        d=n.getDate()-start.getDate(),
        h=n.getHours()-start.getHours(),
        mi=n.getMinutes()-start.getMinutes(),
        s=n.getSeconds()-start.getSeconds();
    if(s<0){s+=60;mi--}
    if(mi<0){mi+=60;h--}
    if(h<0){h+=24;d--}
    if(d<0){d+=new Date(n.getFullYear(),n.getMonth(),0).getDate();mo--}
    if(mo<0){mo+=12;y--}
    set('y',y,'Jahr','Jahre');
    set('mo',mo,'Monat','Monate');
    set('d',d,'Tag','Tage');
    set('h',h,'Stunde','Stunden');
    set('mi',mi,'Minute','Minuten');
    set('s',s,'Sekunde','Sekunden');
  }
  tick(); setInterval(tick,250);
  document.addEventListener('selectstart',function(e){e.preventDefault()});
  var box=$('hearts');
  for(var i=0;i<12;i++){
    var e=document.createElement('span');
    e.className='heart'; e.textContent='♥';
    e.style.left=(Math.random()*96)+'%';
    e.style.fontSize=(10+Math.random()*16)+'px';
    e.style.animationDuration=(9+Math.random()*9)+'s';
    e.style.animationDelay=(-Math.random()*14)+'s';
    box.appendChild(e);
  }
})();
</script>
</body>
</html>
